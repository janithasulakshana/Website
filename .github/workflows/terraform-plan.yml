name: Terraform Plan (Azure SWA)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  terraform-plan:
    name: Terraform Format, Validate, Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TF_VAR_resource_group_name: ${{ vars.TF_VAR_resource_group_name || vars.RESOURCE_GROUP_NAME }}
      TF_VAR_static_web_app_name: ${{ vars.TF_VAR_static_web_app_name || vars.STATIC_WEB_APP_NAME }}
      TF_VAR_location: ${{ vars.TF_VAR_location || 'East US 2' }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug workflow inputs
        run: |
          echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=${FORCE_JAVASCRIPT_ACTIONS_TO_NODE24}"
          echo "TF_VAR_resource_group_name set: $([ -n \"${TF_VAR_resource_group_name}\" ] && echo yes || echo no)"
          echo "TF_VAR_static_web_app_name set: $([ -n \"${TF_VAR_static_web_app_name}\" ] && echo yes || echo no)"

      - name: Azure Login (OIDC)
        if: ${{ env.AZURE_CREDENTIALS == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (Service Principal Secret)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Validate required Terraform variables
        run: |
          missing=0
          if [ -z "${TF_VAR_resource_group_name}" ]; then
            echo "ERROR: Missing GitHub variable TF_VAR_resource_group_name (or fallback RESOURCE_GROUP_NAME)."
            missing=1
          fi
          if [ -z "${TF_VAR_static_web_app_name}" ]; then
            echo "ERROR: Missing GitHub variable TF_VAR_static_web_app_name (or fallback STATIC_WEB_APP_NAME)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color
