apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: letsgo-app-local
  namespace: argocd
  annotations:
    # ArgoCD Image Updater annotations
    argocd-image-updater.argoproj.io/image-list: website-backend=janithasulakshana/website-backend:latest,website-frontend=janithasulakshana/website-frontend:latest
    argocd-image-updater.argoproj.io/write-back-method: argocd
    argocd-image-updater.argoproj.io/website-backend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/website-backend.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/website-backend.force-update: "true"
    argocd-image-updater.argoproj.io/website-frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/website-frontend.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/website-frontend.force-update: "true"
spec:
  project: default
  
  source:
    repoURL: https://github.com/janithasulakshana/Website.git
    targetRevision: main
    path: .
    
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

