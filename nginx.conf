server {
    listen 5000;
    server_name localhost;

    # Health check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"backend","timestamp":"2026-04-04T14:00:00Z"}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # API test endpoint for liveness/readiness probes
    location /api/test {
        return 200 '{"status":"ok","message":"Backend API is responding","version":"1.0.0"}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # API root endpoint
    location /api/ {
        return 200 '{"message":"Backend API endpoints","endpoints":["/api/test","/health"],"status":"running"}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Default response for other requests
    location / {
        return 404 '{"error":"Not Found","message":"Endpoint not found"}';
        add_header Content-Type application/json;
    }
}
