nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: your-dockerhub-user/your-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  NODE_ENV: production
  PORT: "8080"
  LOG_LEVEL: info
  LOG_FORMAT: json

probes:
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5

ingress:
  enabled: false
  className: nginx
  host: your-service.example.com
  path: /

monitoring:
  enabled: true
  interval: 15s
  path: /metrics

logging:
  enabled: true
  source: kubernetes

serviceMonitor:
  enabled: false
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
